name: CI

on:
  pull_request: ~
  push: ~

jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          extensions: none, curl, dom, iconv, mbstring, simplexml, tokenizer, xml, xmlwriter
          coverage: none
      - run: composer install --no-progress
      - run: composer verify
      - run: docker build .
